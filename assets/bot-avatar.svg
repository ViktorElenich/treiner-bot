<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c98e"/>
      <stop offset="50%" style="stop-color:#C8A96E"/>
      <stop offset="100%" style="stop-color:#A8894E"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>

  <!-- Фон — тёмный круг -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Тонкая золотая окружность -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>

  <!-- Внутренняя золотая окружность -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.2"/>

  <!-- Буквы ВЕ — Bebas Neue стиль (геометрические, жирные) -->
  <text x="256" y="295"
        font-family="'Bebas Neue', 'Arial Black', Impact, sans-serif"
        font-size="180"
        font-weight="700"
        fill="url(#gold)"
        text-anchor="middle"
        letter-spacing="12">ВЕ</text>

  <!-- Подпись снизу -->
  <text x="256" y="370"
        font-family="'Montserrat', 'Arial', sans-serif"
        font-size="28"
        font-weight="400"
        fill="#C8A96E"
        text-anchor="middle"
        letter-spacing="8"
        opacity="0.7">TRAINER</text>
</svg>
